/* ------------------------------------------------------------------ */
/*  LOCAL STORAGE HELPERS (real deployed site → use localStorage)      */
/* ------------------------------------------------------------------ */

function lsGet(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function lsSet(key, value) {
  try { localStorage.setItem(key, value); return true; } catch (e) { return false; }
}

/* ------------------------------------------------------------------ */
/*  HELPERS                                                            */
/* ------------------------------------------------------------------ */

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function dayOfYearIndex(len) {
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const diff = now - start;
  const oneDay = 1000 * 60 * 60 * 24;
  return Math.floor(diff / oneDay) % len;
}
function pickRandom(pool, excludeIds) {
  const candidates = pool.filter((q) => !excludeIds.includes(q.id));
  const from = candidates.length ? candidates : pool;
  return from[Math.floor(Math.random() * from.length)];
}
function pickForTheme(theme) {
  const pool = QUOTES.filter((q) => q.theme === theme);
  return pool[Math.floor(Math.random() * pool.length)];
}
function timeUntilMidnight() {
  const now = new Date();
  const midnight = new Date(now);
  midnight.setHours(24, 0, 0, 0);
  const diff = midnight - now;
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  return `${h}h${String(m).padStart(2, "0")}`;
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/*  MAIN COMPONENT                                                     */

function Quotify() {
  const [dark, setDark] = useState(true);
  const [accentKey, setAccentKey] = useState("or");
  const [fontKey, setFontKey] = useState("elegante");
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [tab, setTab] = useState("aujourdhui");

  const [themeFilter, setThemeFilter] = useState("tous");
  const [authorFilter, setAuthorFilter] = useState("tous");
  const [langFilter, setLangFilter] = useState("tous");
  const [search, setSearch] = useState("");

  const [history, setHistory] = useState([]);
  const [historyPos, setHistoryPos] = useState(-1);
  const [recentIds, setRecentIds] = useState([]);

  const [favorites, setFavorites] = useState([]);
  const [showFavorites, setShowFavorites] = useState(false);

  const [views, setViews] = useState(0);
  const [daily, setDaily] = useState({ date: todayStr(), revealed: {} });
  const [revealAnim, setRevealAnim] = useState(null);

  const [mode, setMode] = useState("normal");
  const [spinning, setSpinning] = useState(false);
  const [wheelRotation, setWheelRotation] = useState(0);
  const [wheelQuotes, setWheelQuotes] = useState([]);

  const [copyState, setCopyState] = useState("idle");
  const [toast, setToast] = useState(null);
  const [fading, setFading] = useState(false);

  const canvasRef = useRef(null);
  const accent = ACCENTS[accentKey];
  const font = FONTS[fontKey];

  const authors = useMemo(() => Array.from(new Set(QUOTES.map((q) => q.author))).sort(), []);

  const filteredPool = useMemo(() => {
    return QUOTES.filter((q) => {
      if (themeFilter !== "tous" && q.theme !== themeFilter) return false;
      if (authorFilter !== "tous" && q.author !== authorFilter) return false;
      if (langFilter !== "tous" && q.lang !== langFilter) return false;
      if (search.trim()) {
        const s = search.trim().toLowerCase();
        if (!q.text.toLowerCase().includes(s) && !q.author.toLowerCase().includes(s)) return false;
      }
      return true;
    });
  }, [themeFilter, authorFilter, langFilter, search]);

  const quoteOfDay = useMemo(() => QUOTES[dayOfYearIndex(QUOTES.length)], []);
  const current = historyPos >= 0 ? history[historyPos] : null;

  useEffect(() => {
    const favRaw = lsGet(STORAGE_FAV);
    if (favRaw) { try { setFavorites(JSON.parse(favRaw)); } catch (e) {} }
    const viewsRaw = lsGet(STORAGE_VIEWS);
    if (viewsRaw) setViews(parseInt(viewsRaw, 10) || 0);
    const dailyRaw = lsGet(STORAGE_DAILY);
    if (dailyRaw) {
      try {
        const parsed = JSON.parse(dailyRaw);
        if (parsed.date === todayStr()) setDaily(parsed);
        else { const fresh = { date: todayStr(), revealed: {} }; setDaily(fresh); lsSet(STORAGE_DAILY, JSON.stringify(fresh)); }
      } catch (e) {}
    } else {
      lsSet(STORAGE_DAILY, JSON.stringify({ date: todayStr(), revealed: {} }));
    }

    const first = pickRandom(QUOTES, []);
    setHistory([first]);
    setHistoryPos(0);
    setRecentIds([first.id]);
  }, []);

  const persistFavorites = useCallback((list) => {
    if (!lsSet(STORAGE_FAV, JSON.stringify(list))) showToast("Impossible d'enregistrer les favoris.");
  }, []);

  const bumpViews = useCallback(() => {
    setViews((v) => { const nv = v + 1; lsSet(STORAGE_VIEWS, String(nv)); return nv; });
  }, []);

  function showToast(msg) { setToast(msg); setTimeout(() => setToast(null), 2400); }

  const revealTheme = useCallback((theme) => {
    if (daily.revealed[theme]) { showToast(`Déjà consultée aujourd'hui — revient dans ${timeUntilMidnight()}`); return; }
    const q = pickForTheme(theme);
    setRevealAnim(theme);
    setTimeout(() => setRevealAnim(null), 500);
    const next = { date: todayStr(), revealed: { ...daily.revealed, [theme]: q.id } };
    setDaily(next);
    bumpViews();
    if (!lsSet(STORAGE_DAILY, JSON.stringify(next))) showToast("Impossible d'enregistrer la citation du jour.");
  }, [daily, bumpViews]);

  const revealedCount = Object.keys(daily.revealed).length;

  function triggerFade(cb) { setFading(true); setTimeout(() => { cb(); setFading(false); }, 180); }

  const goNext = useCallback(() => {
    triggerFade(() => {
      if (historyPos < history.length - 1) { setHistoryPos((p) => p + 1); bumpViews(); return; }
      const pool = filteredPool.length ? filteredPool : QUOTES;
      const next = pickRandom(pool, recentIds.slice(-Math.min(5, pool.length - 1)));
      const newHist = [...history, next];
      setHistory(newHist);
      setHistoryPos(newHist.length - 1);
      setRecentIds((r) => [...r.slice(-6), next.id]);
      bumpViews();
    });
  }, [history, historyPos, filteredPool, recentIds]);

  const goPrev = useCallback(() => {
    if (historyPos <= 0) return;
    triggerFade(() => { setHistoryPos((p) => p - 1); bumpViews(); });
  }, [historyPos]);

  function copyQuote(q) {
    const target = q || current;
    if (!target) return;
    const text = `"${target.text}" — ${target.author}`;
    navigator.clipboard.writeText(text).then(() => {
      setCopyState("done"); setTimeout(() => setCopyState("idle"), 1500);
    }).catch(() => showToast("Impossible de copier."));
  }

  function shareQuote(q) {
    const target = q || current;
    if (!target) return;
    const text = `"${target.text}" — ${target.author}`;
    if (navigator.share) { navigator.share({ text }).catch(() => {}); }
    else { navigator.clipboard.writeText(text).then(() => showToast("Citation copiée, prête à partager !"), () => showToast("Impossible de partager.")); }
  }

  function toggleFavorite(id) {
    setFavorites((prev) => {
      const exists = prev.includes(id);
      const next = exists ? prev.filter((f) => f !== id) : [...prev, id];
      persistFavorites(next);
      showToast(exists ? "Retiré des favoris" : "Ajouté aux favoris");
      return next;
    });
  }

  function exportFavorites() {
    const favQuotes = QUOTES.filter((q) => favorites.includes(q.id));
    if (!favQuotes.length) { showToast("Aucun favori à exporter."); return; }
    const text = favQuotes.map((q) => `"${q.text}" — ${q.author}`).join("\n\n");
    const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "quotify-favoris.txt"; a.click();
    URL.revokeObjectURL(url);
  }

  function downloadImage(q) {
    const target = q || current;
    if (!target) return;
    const themeColor = THEME_COLORS[target.theme].hex;
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const W = 1080, H = 1080;
    canvas.width = W; canvas.height = H;
    const bg = dark ? "#14141F" : "#EAE7DE";
    const cardBg = dark ? "#1F1F2E" : "#FBF9F3";
    const textColor = dark ? "#EDEAE3" : "#211F1A";
    const mutedColor = dark ? "#9B96A8" : "#7A7566";
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    const pad = 70;
    ctx.fillStyle = cardBg; roundRect(ctx, pad, pad, W - pad * 2, H - pad * 2, 28); ctx.fill();
    ctx.fillStyle = themeColor; ctx.fillRect(pad, pad, 10, H - pad * 2);
    ctx.fillStyle = themeColor; ctx.font = "900 120px Georgia, serif"; ctx.fillText("\u201C", pad + 60, pad + 140);
    ctx.fillStyle = themeColor; ctx.font = "700 28px Georgia, serif"; ctx.fillText(THEME_LABELS[target.theme].toUpperCase(), pad + 70, pad + 60);
    ctx.fillStyle = textColor; ctx.font = "500 46px Georgia, serif";
    const words = target.text.split(" ");
    let line = ""; const lines = []; const maxWidth = W - pad * 2 - 140;
    words.forEach((w) => {
      const test = line + w + " ";
      if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = w + " "; }
      else line = test;
    });
    if (line) lines.push(line);
    const startY = H / 2 - (lines.length * 58) / 2;
    lines.forEach((l, i) => ctx.fillText(l.trim(), pad + 70, startY + i * 58));
    ctx.fillStyle = themeColor; ctx.font = "700 34px Georgia, serif";
    ctx.fillText(`— ${target.author}`, pad + 70, startY + lines.length * 58 + 60);
    ctx.fillStyle = mutedColor; ctx.font = "600 26px Georgia, serif";
    ctx.fillText("Quotify", pad + 70, H - pad - 30);
    canvas.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `quotify-${target.id}.png`; a.click();
      URL.revokeObjectURL(url);
    });
  }

  function openWheel() {
    const pool = filteredPool.length ? filteredPool : QUOTES;
    const shuffled = [...pool].sort(() => Math.random() - 0.5).slice(0, 8);
    setWheelQuotes(shuffled.length ? shuffled : pool.slice(0, 1));
    setMode("wheel");
  }

  function spinWheel() {
    if (spinning || !wheelQuotes.length) return;
    setSpinning(true);
    const segAngle = 360 / wheelQuotes.length;
    const winnerIdx = Math.floor(Math.random() * wheelQuotes.length);
    const targetAngle = 5 * 360 + (360 - (winnerIdx * segAngle + segAngle / 2));
    setWheelRotation((r) => r + targetAngle);
    setTimeout(() => {
      const winner = wheelQuotes[winnerIdx];
      const newHist = [...history.slice(0, historyPos + 1), winner];
      setHistory(newHist);
      setHistoryPos(newHist.length - 1);
      setRecentIds((r) => [...r.slice(-6), winner.id]);
      bumpViews();
      setSpinning(false);
    }, 3200);
  }

  const bg = dark ? "#14141F" : "#EAE7DE";
  const cardBg = dark ? "#1F1F2E" : "#FBF9F3";
  const textPrimary = dark ? "#EDEAE3" : "#211F1A";
  const textMuted = dark ? "#9B96A8" : "#7A7566";
  const border = dark ? "rgba(237,234,227,0.10)" : "rgba(33,31,26,0.10)";

  // Navigation au clavier (← / →) quand on explore librement
  useEffect(() => {
    function onKey(e) {
      if (tab !== "explorer" || mode !== "normal") return;
      const tag = (e.target && e.target.tagName) || "";
      if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
      if (e.key === "ArrowRight") goNext();
      if (e.key === "ArrowLeft") goPrev();
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [tab, mode, goNext, goPrev]);

  const glow = current ? THEME_COLORS[current.theme].hex : accent.hex;

  return (
    <div style={{ minHeight: "100vh", background: bg, color: textPrimary, fontFamily: "'Inter', sans-serif", transition: "background 0.3s ease, color 0.3s ease", display: "flex", flexDirection: "column", position: "relative", overflowX: "hidden" }}>
      {/* halo décoratif en fond, discret, qui suit la couleur de la citation actuelle */}
      <div aria-hidden="true" style={{
        position: "fixed", top: "-10%", left: "50%", transform: "translateX(-50%)",
        width: 700, height: 700, borderRadius: "50%",
        background: `radial-gradient(circle, ${glow}22 0%, transparent 70%)`,
        pointerEvents: "none", zIndex: 0, transition: "background 0.6s ease",
      }} />
      <style>{`
        * { box-sizing: border-box; }
        button { font-family: inherit; cursor: pointer; }
        .qf-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid ${border}; background: transparent; color: ${textPrimary}; border-radius: 10px; padding: 9px 14px; font-size: 13.5px; font-weight: 500; transition: all 0.15s ease; }
        .qf-btn:hover { border-color: ${accent.hex}; color: ${accent.hex}; transform: translateY(-1px); }
        .qf-btn:active { transform: translateY(0); }
        .qf-btn:focus-visible { outline: 2px solid ${accent.hex}; outline-offset: 2px; }
        .qf-btn.solid { background: ${accent.hex}; border-color: ${accent.hex}; color: #14141F; font-weight: 700; }
        .qf-btn.solid:hover { filter: brightness(1.08); color: #14141F; }
        .qf-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
        .qf-input:focus, .qf-select:focus { outline: 2px solid ${accent.hex}; outline-offset: 1px; }
        .qf-select { border: 1px solid ${border}; background: ${cardBg}; color: ${textPrimary}; border-radius: 10px; padding: 8px 10px; font-size: 13px; }
        .qf-input { border: 1px solid ${border}; background: ${cardBg}; color: ${textPrimary}; border-radius: 10px; padding: 8px 12px; font-size: 13.5px; width: 100%; }
        .qf-fade-enter { opacity: 0; transform: translateY(6px); }
        .qf-fade-visible { opacity: 1; transform: translateY(0); transition: all 0.22s ease; }
        .qf-tab { border: none; background: transparent; color: ${textMuted}; font-weight: 600; font-size: 13.5px; padding: 10px 16px; border-bottom: 2px solid transparent; }
        .qf-tab.active { color: ${textPrimary}; border-bottom-color: ${accent.hex}; }
        .qf-cat-card { border-radius: 16px; padding: 20px; text-align: left; width: 100%; transition: transform 0.15s ease; }
        .qf-cat-card:hover { transform: translateY(-2px); }
        .qf-pop { animation: qf-pop 0.5s ease; }
        @keyframes qf-pop { 0% { transform: scale(0.9); opacity: 0.4; } 60% { transform: scale(1.02); opacity: 1; } 100% { transform: scale(1); } }
        @media (prefers-reduced-motion: reduce) { .qf-fade-visible, .qf-pop, .qf-cat-card { transition: none; animation: none; } }
        ::selection { background: ${accent.soft}; }
      `}</style>

      <header style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "20px 28px", borderBottom: `1px solid ${border}`, flexWrap: "wrap", gap: 12, position: "relative", zIndex: 1 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ width: 34, height: 34, borderRadius: 9, background: accent.soft, display: "flex", alignItems: "center", justifyContent: "center", color: accent.hex }}>
            <QuoteIcon size={18} />
          </div>
          <span style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: 21, letterSpacing: "-0.02em" }}>Quotify</span>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontSize: 12.5, color: textMuted, display: "flex", alignItems: "center", gap: 4, marginRight: 6 }}>
            <EyeIcon size={14} /> {views}
          </span>
          <button className="qf-btn" onClick={() => setDark((d) => !d)} aria-label="Basculer thème">{dark ? <SunIcon size={15} /> : <MoonIcon size={15} />}</button>
          <button className="qf-btn" onClick={() => setSettingsOpen((s) => !s)} aria-label="Personnalisation"><SettingsIcon size={15} /></button>
          <button className="qf-btn" onClick={() => setShowFavorites((s) => !s)}>
            <HeartIcon size={15} fill={showFavorites ? accent.hex : "none"} color={showFavorites ? accent.hex : textPrimary} />
            {favorites.length > 0 ? ` ${favorites.length}` : ""}
          </button>
        </div>
      </header>

      <div aria-hidden="true" style={{ display: "flex", height: 4 }}>
        {THEME_KEYS.map((t) => (
          <div key={t} style={{ flex: 1, background: THEME_COLORS[t].hex, opacity: dark ? 0.85 : 0.7 }} />
        ))}
      </div>

      {settingsOpen && (
        <div style={{ padding: "16px 28px", borderBottom: `1px solid ${border}`, display: "flex", flexWrap: "wrap", gap: 24, background: cardBg }}>
          <div>
            <div style={{ fontSize: 12, color: textMuted, marginBottom: 8 }}>Couleur d'accent (interface)</div>
            <div style={{ display: "flex", gap: 8 }}>
              {Object.entries(ACCENTS).map(([key, a]) => (
                <button key={key} onClick={() => setAccentKey(key)} aria-label={a.name}
                  style={{ width: 26, height: 26, borderRadius: "50%", background: a.hex, border: accentKey === key ? `2.5px solid ${textPrimary}` : "2.5px solid transparent" }} />
              ))}
            </div>
          </div>
          <div>
            <div style={{ fontSize: 12, color: textMuted, marginBottom: 8 }}>Police de la citation</div>
            <div style={{ display: "flex", gap: 8 }}>
              {Object.entries(FONTS).map(([key, f]) => (
                <button key={key} onClick={() => setFontKey(key)} className="qf-btn" style={{ fontFamily: f.family, borderColor: fontKey === key ? accent.hex : border, color: fontKey === key ? accent.hex : textPrimary }}>{f.name}</button>
              ))}
            </div>
          </div>
          <div>
            <div style={{ fontSize: 12, color: textMuted, marginBottom: 8 }}>Coloration par catégorie</div>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap", maxWidth: 220 }}>
              {THEME_KEYS.map((t) => (
                <span key={t} style={{ fontSize: 11, fontWeight: 600, padding: "4px 8px", borderRadius: 6, background: THEME_COLORS[t].soft, color: THEME_COLORS[t].hex }}>{THEME_LABELS[t]}</span>
              ))}
            </div>
          </div>
        </div>
      )}

      <div style={{ display: "flex", padding: "0 28px", borderBottom: `1px solid ${border}`, gap: 4 }}>
        <button className={`qf-tab ${tab === "aujourdhui" ? "active" : ""}`} onClick={() => setTab("aujourdhui")}>
          <CalendarIcon size={14} style={{ marginRight: 6, verticalAlign: -2 }} />
          Aujourd'hui {revealedCount > 0 ? `(${revealedCount}/${THEME_KEYS.length})` : ""}
        </button>
        <button className={`qf-tab ${tab === "explorer" ? "active" : ""}`} onClick={() => setTab("explorer")}>
          <CompassIcon size={14} style={{ marginRight: 6, verticalAlign: -2 }} /> Explorer librement
        </button>
      </div>

      {tab === "aujourdhui" && (
        <main style={{ flex: 1, padding: "28px 20px 40px", maxWidth: 900, margin: "0 auto", width: "100%" }}>
          <div style={{ textAlign: "center", marginBottom: 8 }}>
            <p style={{ fontSize: 13, color: textMuted, margin: 0 }}>Une citation par catégorie, chaque jour. Reviens demain pour de nouvelles découvertes.</p>
            <div style={{ display: "flex", justifyContent: "center", gap: 6, marginTop: 12 }}>
              {THEME_KEYS.map((t) => (
                <span key={t} title={THEME_LABELS[t]} style={{
                  width: 8, height: 8, borderRadius: "50%",
                  background: daily.revealed[t] ? THEME_COLORS[t].hex : "transparent",
                  border: `1.5px solid ${THEME_COLORS[t].hex}`,
                  transition: "background 0.3s ease",
                }} />
              ))}
            </div>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(260px, 1fr))", gap: 16, marginTop: 22 }}>
            {THEME_KEYS.map((theme) => {
              const tColor = THEME_COLORS[theme];
              const revealedId = daily.revealed[theme];
              const revealedQuote = revealedId ? QUOTES.find((q) => q.id === revealedId) : null;
              const isLocked = !revealedQuote;
              return (
                <div key={theme} className={`qf-cat-card ${revealAnim === theme ? "qf-pop" : ""}`} style={{ background: cardBg, border: `1px solid ${border}`, borderTop: `4px solid ${tColor.hex}` }}>
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
                    <span style={{ fontSize: 11.5, fontWeight: 700, letterSpacing: "0.03em", color: tColor.hex, background: tColor.soft, padding: "4px 10px", borderRadius: 20 }}>{THEME_LABELS[theme].toUpperCase()}</span>
                    {isLocked ? <LockIcon size={14} color={textMuted} /> : <SparklesIcon size={14} color={tColor.hex} />}
                  </div>
                  {isLocked ? (
                    <div style={{ padding: "18px 0", textAlign: "center" }}>
                      <p style={{ fontSize: 12.5, color: textMuted, marginBottom: 14 }}>Citation du jour pas encore révélée</p>
                      <button className="qf-btn" style={{ borderColor: tColor.hex, color: tColor.hex, width: "100%" }} onClick={() => revealTheme(theme)}>Découvrir</button>
                    </div>
                  ) : (
                    <div>
                      <p style={{ fontFamily: font.family, fontSize: fontKey === "manuscrite" ? 22 : 15.5, lineHeight: 1.5, margin: 0, marginBottom: 12, minHeight: 60 }}>{revealedQuote.text}</p>
                      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                        <span style={{ fontSize: 12.5, fontWeight: 700, color: tColor.hex }}>— {revealedQuote.author}</span>
                        <div style={{ display: "flex", gap: 4 }}>
                          <button className="qf-btn" style={{ padding: 7 }} onClick={() => toggleFavorite(revealedQuote.id)} aria-label="Favori"><HeartIcon size={13} fill={favorites.includes(revealedQuote.id) ? tColor.hex : "none"} color={favorites.includes(revealedQuote.id) ? tColor.hex : textPrimary} /></button>
                          <button className="qf-btn" style={{ padding: 7 }} onClick={() => copyQuote(revealedQuote)} aria-label="Copier"><CopyIcon size={13} /></button>
                          <button className="qf-btn" style={{ padding: 7 }} onClick={() => downloadImage(revealedQuote)} aria-label="Télécharger"><DownloadIcon size={13} /></button>
                        </div>
                      </div>
                      <p style={{ fontSize: 10.5, color: textMuted, marginTop: 12, marginBottom: 0 }}>Prochaine citation « {THEME_LABELS[theme]} » dans {timeUntilMidnight()}</p>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </main>
      )}

      {tab === "explorer" && (
        <React.Fragment>
          <div style={{ padding: "10px 28px", fontSize: 12.5, color: textMuted, borderBottom: `1px solid ${border}`, display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ color: THEME_COLORS[quoteOfDay.theme].hex, fontWeight: 700 }}>Citation du jour</span>
            <span>« {quoteOfDay.text.slice(0, 70)}{quoteOfDay.text.length > 70 ? "…" : ""} » — {quoteOfDay.author}</span>
          </div>
          <div style={{ padding: "16px 28px", display: "flex", flexWrap: "wrap", gap: 10, alignItems: "center" }}>
            <div style={{ position: "relative", flex: "1 1 220px", minWidth: 180 }}>
              <SearchIcon size={14} style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)", color: textMuted }} />
              <input className="qf-input" style={{ paddingLeft: 30 }} placeholder="Rechercher un mot ou un auteur…" value={search} onChange={(e) => setSearch(e.target.value)} />
            </div>
            <select className="qf-select" value={themeFilter} onChange={(e) => setThemeFilter(e.target.value)}>
              <option value="tous">Tous les thèmes</option>
              {Object.entries(THEME_LABELS).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
            </select>
            <select className="qf-select" value={authorFilter} onChange={(e) => setAuthorFilter(e.target.value)}>
              <option value="tous">Tous les auteurs</option>
              {authors.map((a) => <option key={a} value={a}>{a}</option>)}
            </select>
            <select className="qf-select" value={langFilter} onChange={(e) => setLangFilter(e.target.value)}>
              <option value="tous">FR + EN</option>
              <option value="fr">Français</option>
              <option value="en">English</option>
            </select>
            <div style={{ display: "flex", gap: 6, marginLeft: "auto" }}>
              <button className={`qf-btn ${mode === "normal" ? "solid" : ""}`} onClick={() => setMode("normal")}>Carte</button>
              <button className={`qf-btn ${mode === "wheel" ? "solid" : ""}`} onClick={openWheel}><DiscIcon size={14} /> Roue</button>
            </div>
          </div>
          <main style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "10px 20px 40px" }}>
            {mode === "normal" && current && (
              <div className={fading ? "qf-fade-enter" : "qf-fade-visible"} style={{ width: "100%", maxWidth: 620, background: cardBg, border: `1px solid ${border}`, borderLeft: `6px solid ${THEME_COLORS[current.theme].hex}`, borderRadius: 18, padding: "44px 40px", boxShadow: dark ? "0 20px 50px rgba(0,0,0,0.35)" : "0 20px 50px rgba(0,0,0,0.08)" }}>
                <span style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.03em", color: THEME_COLORS[current.theme].hex, background: THEME_COLORS[current.theme].soft, padding: "4px 10px", borderRadius: 20 }}>{THEME_LABELS[current.theme].toUpperCase()}</span>
                <div style={{ fontFamily: "'Fraunces', serif", fontSize: "clamp(48px, 9vw, 64px)", color: THEME_COLORS[current.theme].hex, lineHeight: 0.5, margin: "18px 0" }}>"</div>
                <p style={{ fontFamily: font.family, fontSize: fontKey === "manuscrite" ? "clamp(24px, 5vw, 30px)" : "clamp(18px, 4vw, 23px)", lineHeight: 1.5, fontWeight: fontKey === "moderne" ? 500 : 400, margin: 0, marginBottom: 22 }}>{current.text}</p>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10 }}>
                  <div>
                    <div style={{ fontWeight: 700, color: THEME_COLORS[current.theme].hex, fontSize: 15 }}>— {current.author}</div>
                    <div style={{ fontSize: 11.5, color: textMuted, marginTop: 3 }}>{current.lang.toUpperCase()}</div>
                  </div>
                  <button className="qf-btn" onClick={() => toggleFavorite(current.id)} aria-label="Favori"><HeartIcon size={15} fill={favorites.includes(current.id) ? accent.hex : "none"} color={favorites.includes(current.id) ? accent.hex : textPrimary} /></button>
                </div>
              </div>
            )}
            {mode === "normal" && current && (
              <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginTop: 22, justifyContent: "center", maxWidth: 620, width: "100%" }}>
                <button className="qf-btn" onClick={goPrev} disabled={historyPos <= 0}><ChevronLeftIcon size={15} /> Précédente</button>
                <button className="qf-btn solid" onClick={goNext}><RefreshIcon size={15} /> Nouvelle citation</button>
                <button className="qf-btn" onClick={goNext}>Suivante <ChevronRightIcon size={15} /></button>
                <button className="qf-btn" onClick={() => copyQuote()}>{copyState === "done" ? <CheckIcon size={15} /> : <CopyIcon size={15} />}{copyState === "done" ? "Copié" : "Copier"}</button>
                <button className="qf-btn" onClick={() => shareQuote()}><ShareIcon size={15} /> Partager</button>
                <button className="qf-btn" onClick={() => downloadImage()}><DownloadIcon size={15} /> Image</button>
              </div>
            )}
            {mode === "normal" && current && (
              <p style={{ fontSize: 11, color: textMuted, marginTop: 12, opacity: 0.7 }}>Astuce : les flèches ← → du clavier changent aussi de citation.</p>
            )}
            {mode === "normal" && !filteredPool.length && (
              <p style={{ color: textMuted, marginTop: 20, fontSize: 13.5 }}>Aucune citation ne correspond à ces filtres — le tirage utilise l'ensemble des citations.</p>
            )}
            {mode === "wheel" && (
              <WheelView wheelQuotes={wheelQuotes} rotation={wheelRotation} spinning={spinning} onSpin={spinWheel} accent={accent} textPrimary={textPrimary} cardBg={cardBg} border={border} current={current} fontFamily={font.family} fontKey={fontKey} onToggleFav={toggleFavorite} isFav={current ? favorites.includes(current.id) : false} />
            )}
          </main>
        </React.Fragment>
      )}

      {showFavorites && (
        <div style={{ position: "fixed", top: 0, right: 0, bottom: 0, width: "min(360px, 100vw)", background: cardBg, borderLeft: `1px solid ${border}`, zIndex: 50, display: "flex", flexDirection: "column", boxShadow: "-10px 0 40px rgba(0,0,0,0.25)" }}>
          <div style={{ padding: 18, display: "flex", alignItems: "center", justifyContent: "space-between", borderBottom: `1px solid ${border}` }}>
            <span style={{ fontWeight: 700, fontFamily: "'Fraunces', serif" }}>Favoris ({favorites.length})</span>
            <button className="qf-btn" onClick={() => setShowFavorites(false)}><XIcon size={15} /></button>
          </div>
          <div style={{ flex: 1, overflowY: "auto", padding: 14 }}>
            {favorites.length === 0 && <p style={{ fontSize: 13, color: textMuted }}>Aucun favori pour l'instant. Clique sur le cœur d'une citation pour l'enregistrer ici.</p>}
            {QUOTES.filter((q) => favorites.includes(q.id)).map((q) => (
              <div key={q.id} style={{ border: `1px solid ${border}`, borderLeft: `4px solid ${THEME_COLORS[q.theme].hex}`, borderRadius: 10, padding: 12, marginBottom: 10, fontSize: 13 }}>
                <span style={{ fontSize: 10, fontWeight: 700, color: THEME_COLORS[q.theme].hex }}>{THEME_LABELS[q.theme].toUpperCase()}</span>
                <p style={{ margin: "6px 0 8px", lineHeight: 1.4 }}>"{q.text}"</p>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <span style={{ color: THEME_COLORS[q.theme].hex, fontWeight: 600 }}>— {q.author}</span>
                  <button className="qf-btn" onClick={() => toggleFavorite(q.id)} aria-label="Retirer"><XIcon size={13} /></button>
                </div>
              </div>
            ))}
          </div>
          {favorites.length > 0 && (
            <div style={{ padding: 14, borderTop: `1px solid ${border}` }}>
              <button className="qf-btn solid" style={{ width: "100%" }} onClick={exportFavorites}><DownloadIcon size={15} /> Exporter en .txt</button>
            </div>
          )}
        </div>
      )}

      {toast && (
        <div style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", background: dark ? "#EDEAE3" : "#211F1A", color: dark ? "#14141F" : "#EAE7DE", padding: "10px 18px", borderRadius: 10, fontSize: 13, zIndex: 100, boxShadow: "0 10px 30px rgba(0,0,0,0.25)" }}>{toast}</div>
      )}

      <footer style={{ textAlign: "center", padding: "14px", fontSize: 11.5, color: textMuted, borderTop: `1px solid ${border}` }}>Quotify — {QUOTES.length} citations, zéro serveur, zéro coût.</footer>
      <canvas ref={canvasRef} style={{ display: "none" }} />
    </div>
  );
}

function WheelView({ wheelQuotes, rotation, spinning, onSpin, accent, textPrimary, cardBg, border, current, fontFamily, fontKey, onToggleFav, isFav }) {
  const colors = wheelQuotes.map((q) => THEME_COLORS[q.theme].hex);
  const seg = 360 / (wheelQuotes.length || 1);
  const currentColor = current ? THEME_COLORS[current.theme].hex : accent.hex;
  const usedThemes = Array.from(new Set(wheelQuotes.map((q) => q.theme)));
  return (
    <div style={{ textAlign: "center" }}>
      <div style={{ position: "relative", width: 280, height: 280, margin: "0 auto 16px" }}>
        <div style={{ position: "absolute", top: -4, left: "50%", transform: "translateX(-50%)", width: 0, height: 0, borderLeft: "10px solid transparent", borderRight: "10px solid transparent", borderTop: `16px solid ${textPrimary}`, zIndex: 5 }} />
        <div style={{ width: "100%", height: "100%", borderRadius: "50%", position: "relative", background: `conic-gradient(${wheelQuotes.map((_, i) => `${colors[i % colors.length]} ${i * seg}deg ${(i + 1) * seg}deg`).join(", ")})`, transform: `rotate(${rotation}deg)`, transition: spinning ? "transform 3.1s cubic-bezier(0.17, 0.67, 0.16, 0.99)" : "none", border: `4px solid ${cardBg}`, boxShadow: "0 10px 30px rgba(0,0,0,0.25)" }}>
          {wheelQuotes.map((q, i) => {
            const mid = i * seg + seg / 2;
            return (
              <div key={i} style={{
                position: "absolute", top: "50%", left: "50%", width: 100, textAlign: "center",
                transform: `rotate(${mid}deg) translate(0, -108px) rotate(0deg)`,
                transformOrigin: "0 0", marginLeft: -50,
              }}>
                <span style={{ fontSize: 9.5, fontWeight: 800, color: "#14141F", letterSpacing: "0.02em", textShadow: "0 1px 2px rgba(255,255,255,0.35)" }}>
                  {THEME_LABELS[q.theme].toUpperCase()}
                </span>
              </div>
            );
          })}
        </div>
      </div>
      <div style={{ display: "flex", justifyContent: "center", gap: 10, flexWrap: "wrap", marginBottom: 18 }}>
        {usedThemes.map((t) => (
          <span key={t} style={{ display: "inline-flex", alignItems: "center", gap: 5, fontSize: 11, color: textPrimary, opacity: 0.85 }}>
            <span style={{ width: 8, height: 8, borderRadius: "50%", background: THEME_COLORS[t].hex, display: "inline-block" }} />
            {THEME_LABELS[t]}
          </span>
        ))}
      </div>
      <button className="qf-btn solid" onClick={onSpin} disabled={spinning}><DiscIcon size={15} /> {spinning ? "Ça tourne…" : "Faire tourner la roue"}</button>
      {current && (
        <div style={{ marginTop: 26, maxWidth: 520, marginLeft: "auto", marginRight: "auto", background: cardBg, border: `1px solid ${border}`, borderLeft: `6px solid ${currentColor}`, borderRadius: 16, padding: "26px 28px", textAlign: "left" }}>
          <p style={{ fontFamily, fontSize: fontKey === "manuscrite" ? 26 : 19, lineHeight: 1.5, margin: 0, marginBottom: 14 }}>{current.text}</p>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span style={{ fontWeight: 700, color: currentColor, fontSize: 14 }}>— {current.author}</span>
            <button className="qf-btn" onClick={() => onToggleFav(current.id)}><HeartIcon size={15} fill={isFav ? currentColor : "none"} color={isFav ? currentColor : textPrimary} /></button>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Quotify />);
</script>
</body>
</html>
