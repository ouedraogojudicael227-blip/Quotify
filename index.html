<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quotify</title>
  <meta name="description" content="Une citation inspirante chaque jour. Sans compte." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#c9842a" />
</head>
<body>
  <div id="header"></div>
  <main class="wrap">
    <section class="hero">
      <h1 id="title"></h1>
      <p id="tag"></p>
      <p class="row">
        <button class="btn" id="installBtn" type="button"></button>
        <button class="btn ghost" type="button" id="shellBtn"></button>
        <button class="btn ghost" type="button" id="notifBtn"></button>
      </p>
    </section>
    <p class="note" id="dailyLabel"></p>
    <div id="daily"></div>
    <p class="note" id="weekLabel"></p>
    <div id="week"></div>
    <p class="row">
      <button class="btn" type="button" id="randBtn"></button>
    </p>
    <div id="rand"></div>
    <h2 id="histoTitle" style="margin-top:28px"></h2>
    <div id="histo"></div>
  </main>
  <div id="footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById("header").outerHTML = headerHTML("home");
    document.getElementById("footer").outerHTML = footerHTML();
    const t = (k) => Quotify.t(k);
    document.getElementById("title").textContent = t("brand");
    document.getElementById("tag").textContent = t("tagline");
    document.getElementById("installBtn").textContent = t("installer");
    document.getElementById("installBtn").onclick = () => Quotify.install();
    const app = Quotify.isApp();
    document.getElementById("shellBtn").textContent = app ? "Site" : "App";
    document.getElementById("notifBtn").textContent = t("activerNotifs") + " · " + t("notifs");
    document.getElementById("notifBtn").onclick = () => Quotify.enableNotifs();
    document.getElementById("shellBtn").onclick = () => {
      localStorage.setItem("quotify-shell", app ? "web" : "app");
      location.href = app ? "index.html" : "index.html?shell=app";
    };
    const q = Quotify.quoteOfDay();
    function tick() {
      document.getElementById("dailyLabel").textContent =
        t("citationDuJour") + " · " + t("prochaine") + " (" + Quotify.untilMidnight() + ")";
    }
    tick();
    setInterval(tick, 30000);
    document.getElementById("daily").innerHTML = quoteCard(q);
    document.getElementById("weekLabel").textContent = t("semaine");
    document.getElementById("week").innerHTML = quoteCard(Quotify.quoteOfWeek());
    document.getElementById("randBtn").textContent = t("aleatoire");
    let current = q;
    document.getElementById("histoTitle").textContent = t("histo");
    document.getElementById("histo").innerHTML = [1,2,3].map((d) => {
      const label = d === 1 ? t("hier") : (t("ilYa") + d + " " + t("jours")).trim();
      return `<p class="note">${label}</p>` + quoteCard(Quotify.quoteAtOffset(d));
    }).join("");
    document.getElementById("randBtn").onclick = () => {
      current = Quotify.pick(current.id);
      document.getElementById("rand").innerHTML = quoteCard(current);
      document.getElementById("rand").scrollIntoView({ behavior: "smooth", block: "center" });
    };
  </script>
</body>
</html>
