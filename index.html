<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quotify</title>
  <meta name="description" content="Une citation inspirante chaque jour. Sans compte." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#c9842a" />
</head>
<body>
  <div id="header"></div>
  <main class="wrap">
    <section class="hero">
      <h1 id="title"></h1>
      <p id="tag"></p>
      <p class="row">
        <button class="btn" id="installBtn"></button>
        <button class="btn ghost" onclick="Quotify.isApp() ? (localStorage.setItem('quotify-shell','web'), location.href='index.html') : (localStorage.setItem('quotify-shell','app'), location.href='index.html?shell=app')" id="shellBtn"></button>
      </p>
    </section>
    <p class="note" id="dailyLabel"></p>
    <div id="daily"></div>
  </main>
  <div id="footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById("header").outerHTML = headerHTML("home");
    document.getElementById("footer").outerHTML = footerHTML();
    const t = (k) => Quotify.t(k);
    document.getElementById("title").textContent = t("brand");
    document.getElementById("tag").textContent = t("tagline");
    document.getElementById("installBtn").textContent = t("installer");
    document.getElementById("installBtn").onclick = () => Quotify.install();
    document.getElementById("shellBtn").textContent = Quotify.isApp() ? "Site" : "App";
    document.getElementById("dailyLabel").textContent = t("citationDuJour") + " · " + t("prochaine");
    const q = Quotify.quoteOfDay();
    document.getElementById("daily").innerHTML = quoteCard(q,
      `<button class="btn" onclick="location.href='explorer.html'">${t("explorer")}</button>`);
  </script>
</body>
</html>
