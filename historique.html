<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jours passés — Quotify</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <div id="header"></div>
  <main class="wrap">
    <h1 id="title" style="margin-top:24px"></h1>
    <div class="grid" id="list"></div>
  </main>
  <div id="footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById("header").outerHTML = headerHTML("histo");
    document.getElementById("footer").outerHTML = footerHTML();
    const t = (k) => Quotify.t(k);
    document.getElementById("title").textContent = t("histo");
    const bits = [];
    for (let d = 1; d <= 7; d++) {
      const q = Quotify.quoteAtOffset(d);
      const label = d === 1 ? t("hier") : (t("ilYa") + d + " " + t("jours")).trim();
      bits.push(`<p class="note">${label}</p>` + quoteCard(q));
    }
    document.getElementById("list").innerHTML = bits.join("");
  </script>
</body>
</html>
