<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Explorer — Quotify</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <div id="header"></div>
  <main class="wrap">
    <h1 id="title" style="margin-top:24px"></h1>
    <form class="search" onsubmit="event.preventDefault(); render()">
      <input id="q" />
      <button class="btn" type="submit" id="btn"></button>
    </form>
    <div class="chips" id="chips"></div>
    <div class="chips" id="packs"></div>
    <div class="chips" id="langs"></div>
    <p class="count" id="count"></p>
    <div class="grid" id="list"></div>
  </main>
  <div id="footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById("header").outerHTML = headerHTML("explorer");
    document.getElementById("footer").outerHTML = footerHTML();
    const t = (k) => Quotify.t(k);
    document.getElementById("title").textContent = t("explorer");
    document.getElementById("q").placeholder = t("searchPh");
    document.getElementById("btn").textContent = t("chercher");
    let theme = "tous";
    let langF = "tous";
    let pack = "tous";
    function render() {
      const s = (document.getElementById("q").value || "").toLowerCase();
      const items = QUOTIFY_DATA.quotes.filter((q) => {
        if (theme !== "tous" && q.theme !== theme) return false;
        if (langF !== "tous" && q.lang !== langF) return false;
        if (pack !== "tous" && Quotify.packOf(q) !== pack) return false;
        if (!s) return true;
        return (q.text + " " + q.author + " " + Quotify.themeLabel(q.theme)).toLowerCase().includes(s);
      });
      document.getElementById("count").textContent = items.length + " " + t("resultats");
      document.getElementById("list").innerHTML = items.length
        ? items.map((q) => quoteCard(q)).join("")
        : `<p class="note">${t("aucun")}</p>`;
    }
    document.getElementById("chips").innerHTML =
      `<button class="chip on" type="button" data-th="tous">${t("tous")}</button>` +
      Object.keys(QUOTIFY_DATA.themes).map((id) =>
        `<button class="chip" type="button" data-th="${id}">${Quotify.themeLabel(id)}</button>`
      ).join("");
    document.getElementById("chips").onclick = (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      theme = b.dataset.th;
      document.querySelectorAll("#chips .chip").forEach((c) => c.classList.toggle("on", c === b));
      render();
    };
    document.getElementById("packs").innerHTML =
      `<button class="chip on" type="button" data-pk="tous">${t("packs")}</button>` +
      `<button class="chip" type="button" data-pk="afrique">${t("packAfrique")}</button>` +
      `<button class="chip" type="button" data-pk="etudes">${t("packEtudes")}</button>` +
      `<button class="chip" type="button" data-pk="travail">${t("packTravail")}</button>`;
    document.getElementById("packs").onclick = (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      pack = b.dataset.pk;
      document.querySelectorAll("#packs .chip").forEach((c) => c.classList.toggle("on", c === b));
      render();
    };
    document.getElementById("langs").innerHTML =
      `<button class="chip on" type="button" data-lg="tous">${t("toutesLangues")}</button>` +
      `<button class="chip" type="button" data-lg="fr">${t("frSeul")}</button>` +
      `<button class="chip" type="button" data-lg="en">${t("enSeul")}</button>`;
    document.getElementById("langs").onclick = (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      langF = b.dataset.lg;
      document.querySelectorAll("#langs .chip").forEach((c) => c.classList.toggle("on", c === b));
      render();
    };
    document.getElementById("q").addEventListener("input", render);
    render();
  </script>
</body>
</html>
